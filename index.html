<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ØLNIAN — Email Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Belleza&family=Nunito+Sans:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-wordmark">ØL<span class="accent">N</span>IAN</div>
            <div class="sidebar-eyebrow">Drafts</div>
        </div>
        <button id="new-draft-btn" class="new-draft-btn" type="button">+ New Email</button>
        <ul id="draft-list"></ul>
    </aside>

    <main id="editor">
        <div id="toolbar">
            <div class="toolbar-group">
                <span class="toolbar-label">Name</span>
                <input id="draft-name-input" class="toolbar-input" type="text" autocomplete="off" spellcheck="false">
            </div>
            <div class="toolbar-group">
                <span class="toolbar-label">Subject</span>
                <input id="draft-subject-input" class="toolbar-input" type="text" autocomplete="off" placeholder="Subject line">
            </div>
            <div class="toolbar-group">
                <span class="toolbar-label">Hero img</span>
                <input id="hero-url-input" class="toolbar-input url" type="text" autocomplete="off" placeholder="https://…">
            </div>
            <div class="toolbar-group">
                <span class="toolbar-label">Product img</span>
                <input id="product-url-input" class="toolbar-input url" type="text" autocomplete="off" placeholder="https://…">
            </div>
            <div class="toolbar-group toolbar-group-accent">
                <span class="toolbar-label">Accent</span>
                <input id="accent-color-input" class="toolbar-color" type="color" value="#F2663A" title="Brand accent color">
            </div>
            <div id="viewport-toggle" role="group" aria-label="Preview width">
                <button type="button" data-width="480">480</button>
                <button type="button" data-width="600">600</button>
            </div>
            <div class="toolbar-spacer"></div>
            <span id="save-indicator"></span>
            <button id="save-btn" class="btn" type="button">Save Draft</button>
            <button id="copy-btn" class="btn btn-primary" type="button">Copy Email HTML</button>
        </div>

        <div id="preview-scroll">
            <div id="preview-frame" class="viewport-mobile"></div>
        </div>
    </main>

</div>

<script src="email-template.js"></script>
<script src="editor.js"></script>
</body>
</html>
